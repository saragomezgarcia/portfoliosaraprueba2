<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sara Gómez — Diseñadora visual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f3f0eb;--ink:#1a1a1a;--muted:#6b665f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--ink:#f3f0eb;--muted:#a09a91}}
:root[data-theme="dark"]{--bg:#171614;--ink:#f3f0eb;--muted:#a09a91}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.stage{position:relative;height:100%;width:100%;cursor:grab;touch-action:pan-y;user-select:none}
.stage.drag{cursor:grabbing}
h1{position:absolute;inset:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:400;font-size:clamp(2.2rem,7.2vw,6.5rem);line-height:1.02;letter-spacing:-.035em;pointer-events:none;z-index:2}
h1 small{display:block;font-size:inherit;color:var(--ink)}
.sub{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.85rem;color:var(--muted);letter-spacing:.02em;z-index:3;pointer-events:none}
nav{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:28px;right:28px;display:flex;justify-content:space-between;font-size:.9rem;z-index:3}
nav a{color:var(--ink);text-decoration:none}
.it{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.it svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.12))}
</style>
</head>
<body>
<div class="stage" id="stage">
  <nav><a href="#">Sara Gómez</a><a href="#">Contacto</a></nav>
  <h1><small>Hola, soy Sara Gómez</small><small>diseñadora visual</small></h1>
  <div class="sub">Arrastra o haz scroll para mover el carrusel</div>
</div>
<script>
// Para usar tus propias imágenes recortadas (PNG con fondo transparente),
// sustituye cada elemento por: '<img src="tu-imagen.png" alt="">'
const items=[
 '<svg viewBox="0 0 100 130"><ellipse cx="50" cy="48" rx="38" ry="46" fill="#2f6fe0"/><ellipse cx="38" cy="30" rx="10" ry="16" fill="#6aa0f5" opacity=".6"/><path d="M50 94 q-8 14 4 22 q10 8 -2 14" stroke="#f3a6c8" stroke-width="4" fill="none" stroke-linecap="round"/></svg>',
 '<svg viewBox="0 0 140 110"><rect width="140" height="110" fill="#9b4a8a" transform="rotate(-4 70 55)"/><circle cx="70" cy="95" r="46" fill="#f0a21c"/><circle cx="70" cy="95" r="30" fill="#f6c23a"/></svg>',
 '<svg viewBox="0 0 120 70"><ellipse cx="32" cy="38" rx="26" ry="14" fill="#f27fb5" transform="rotate(-12 32 38)"/><ellipse cx="86" cy="32" rx="26" ry="14" fill="#f27fb5" transform="rotate(10 86 32)"/><ellipse cx="32" cy="34" rx="12" ry="6" fill="#7a2f4f" transform="rotate(-12 32 34)"/><ellipse cx="86" cy="28" rx="12" ry="6" fill="#7a2f4f" transform="rotate(10 86 28)"/></svg>',
 '<svg viewBox="0 0 120 120"><g fill="#fff"><circle cx="60" cy="18" r="16"/><circle cx="102" cy="60" r="16"/><circle cx="60" cy="102" r="16"/><circle cx="18" cy="60" r="16"/><circle cx="90" cy="30" r="14"/><circle cx="90" cy="90" r="14"/><circle cx="30" cy="90" r="14"/><circle cx="30" cy="30" r="14"/></g><circle cx="60" cy="60" r="26" fill="#f5c518"/></svg>',
 '<svg viewBox="0 0 120 120"><circle cx="60" cy="62" r="48" fill="#161616"/><circle cx="40" cy="55" r="7" fill="#e8a24a"/><circle cx="80" cy="55" r="7" fill="#e8a24a"/><ellipse cx="60" cy="78" rx="18" ry="12" fill="#333"/><path d="M48 92 l6 -6 l6 6 l6 -6 l6 6" stroke="#fff" stroke-width="3" fill="none"/></svg>',
 '<svg viewBox="0 0 110 80"><ellipse cx="55" cy="40" rx="48" ry="30" fill="#f4e04d" transform="rotate(-18 55 40)"/><ellipse cx="38" cy="30" rx="14" ry="8" fill="#fff6a8" opacity=".7" transform="rotate(-18 38 30)"/><path d="M96 12 q8 -6 12 2" stroke="#6a8a1e" stroke-width="5" fill="none" stroke-linecap="round"/></svg>',
 '<svg viewBox="0 0 80 140"><ellipse cx="40" cy="42" rx="32" ry="40" fill="#f6d5e0" stroke="#c6e24a" stroke-width="7"/><path d="M14 30 H66 M12 46 H68 M18 60 H62 M28 8 V76 M48 8 V76" stroke="#e7a5bf" stroke-width="2"/><rect x="34" y="82" width="12" height="54" rx="6" fill="#c6e24a"/></svg>',
 '<svg viewBox="0 0 120 120"><path d="M60 4 L74 44 L116 46 L82 70 L94 112 L60 88 L26 112 L38 70 L4 46 L46 44Z" fill="#6aa0c8"/><path d="M60 30 L68 52 L90 54 L72 66 L78 88 L60 76Z" fill="#4f86ad" opacity=".5"/></svg>'
];
const stage=document.getElementById('stage');
const els=items.map((h,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=h;stage.appendChild(d);return d});
let angle=0,vel=0.0016,W=0,H=0;
function size(){W=stage.clientWidth;H=stage.clientHeight}
size();addEventListener('resize',size);
function frame(){
  angle+=vel; vel+=(0.0016-vel)*0.04;
  const n=els.length, small=W<700;
  const rx=W*(small?0.40:0.44), ry=H*(small?0.36:0.38);
  els.forEach((el,i)=>{
    const a=angle+i*Math.PI*2/n;
    const depth=(Math.sin(a)+1)/2;               // 0 arriba, 1 abajo
    const base=Math.min(W,H)*(small?0.2:0.19);
    const s=0.75+depth*0.45;
    const x=W/2+rx*Math.cos(a);
    const y=H/2+ry*Math.sin(a)+Math.sin(a*2+angle*2)*10;
    const rot=Math.cos(a)*14+Math.sin(a*3)*6;
    el.style.width=base+'px';
    el.style.transform='translate('+(x-base/2)+'px,'+(y-base/2)+'px) rotate('+rot+'deg) scale('+s+')';
    el.style.zIndex=depth>0.55?4:1;
  });
  requestAnimationFrame(frame);
}
frame();
let down=false,lx=0;
stage.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;stage.classList.add('drag')});
addEventListener('pointerup',()=>{down=false;stage.classList.remove('drag')});
addEventListener('pointermove',e=>{if(!down)return;vel=(e.clientX-lx)*0.0035;angle+=vel;lx=e.clientX});
addEventListener('wheel',e=>{vel+=(e.deltaY+e.deltaX)*0.00006},{passive:true});
</script>
</body>
</html>
